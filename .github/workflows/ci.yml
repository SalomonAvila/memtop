name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  comprobar:
    name: Formato, lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  estatico:
    name: Binario estático (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: ./target/${{ matrix.target }}/release/memtop --version

  # Compila el RPM igual que COPR (.copr/Makefile + packaging/memtop.spec) para detectar
  # un .spec roto antes de publicar.
  rpm:
    name: RPM (Fedora ${{ matrix.fedora }})
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43", "44"]
    steps:
      # git antes del checkout: sin él, actions/checkout baja el código sin el
      # repositorio y git archive (en .copr/Makefile) no funciona.
      - run: dnf -y install git-core make
      - uses: actions/checkout@v4
      - name: Generar el SRPM
        run: make -f .copr/Makefile srpm outdir="$PWD/rpm" spec="$PWD/packaging/memtop.spec"
      - name: Instalar las dependencias de compilación
        run: dnf -y builddep rpm/*.src.rpm
      - name: Compilar el RPM
        run: rpmbuild --rebuild --define "_rpmdir $PWD/rpm" rpm/*.src.rpm
      - name: Instalar y probar el paquete
        run: |
          dnf -y install rpm/*/memtop-[0-9]*.rpm
          rpm -qil memtop
          memtop --version
