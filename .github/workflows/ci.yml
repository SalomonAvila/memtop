name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  static:
    name: Static binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: ./target/${{ matrix.target }}/release/memtop --version

  # Builds the RPM the same way COPR does (.copr/Makefile + packaging/memtop.spec) to catch
  # a broken .spec before publishing.
  rpm:
    name: RPM (Fedora ${{ matrix.fedora }})
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43", "44"]
    steps:
      # git before checkout: without it, actions/checkout downloads the code without the
      # repository and git archive (in .copr/Makefile) does not work.
      - run: dnf -y install git-core make
      - uses: actions/checkout@v4
      - name: Build the SRPM
        run: make -f .copr/Makefile srpm outdir="$PWD/rpm" spec="$PWD/packaging/memtop.spec"
      - name: Install build dependencies
        run: dnf -y builddep rpm/*.src.rpm
      - name: Build the RPM
        run: rpmbuild --rebuild --define "_rpmdir $PWD/rpm" rpm/*.src.rpm
      - name: Install and test the package
        run: |
          dnf -y install rpm/*/memtop-[0-9]*.rpm
          rpm -qil memtop
          memtop --version
