# Publishes a version when a vX.Y.Z tag is pushed:
#   git tag v0.1.1 && git push origin v0.1.1
# Creates the GitHub release and attaches static (musl) binaries for x86_64 and aarch64,
# which work on any Linux distribution without installing anything else.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches Cargo.toml
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "memtop $GITHUB_REF_NAME" --generate-notes

  binaries:
    name: Binary ${{ matrix.target }}
    needs: create
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="memtop-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/memtop" LICENSE THIRD_PARTY_NOTICES.md README.md CHANGELOG.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" memtop-${{ matrix.target }}.tar.gz memtop-${{ matrix.target }}.tar.gz.sha256
