# Publica una versión al subir una etiqueta vX.Y.Z:
#   git tag v0.1.0 && git push origin v0.1.0
# Crea la release en GitHub y adjunta binarios estáticos (musl) para x86_64 y aarch64,
# que funcionan en cualquier distribución Linux sin instalar nada más.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  crear:
    name: Crear release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que la etiqueta coincide con Cargo.toml
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $version de Cargo.toml"
            exit 1
          }
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "memtop $GITHUB_REF_NAME" --generate-notes

  binarios:
    name: Binario ${{ matrix.target }}
    needs: crear
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Empaquetar
        run: |
          nombre="memtop-${{ matrix.target }}"
          mkdir "$nombre"
          cp "target/${{ matrix.target }}/release/memtop" LICENSE THIRD_PARTY_NOTICES.md README.md "$nombre/"
          tar czf "$nombre.tar.gz" "$nombre"
          sha256sum "$nombre.tar.gz" > "$nombre.tar.gz.sha256"
      - name: Subir a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" memtop-${{ matrix.target }}.tar.gz memtop-${{ matrix.target }}.tar.gz.sha256
