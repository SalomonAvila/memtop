[package]
name = "memtop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Tu fastfetch + htop en la terminal: foto a la izquierda, monitor del sistema a la derecha"
license = "MIT"
readme = "README.md"
repository = "https://github.com/SalomonAvila/memtop"
keywords = ["tui", "monitor", "fastfetch", "htop", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1"
crossterm = "0.29"
image = "0.25"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
sysinfo = { version = "0.40", default-features = false, features = ["component", "disk", "network", "system", "user"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
